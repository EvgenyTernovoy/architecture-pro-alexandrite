---
# Jaeger all-in-one
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.55
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 16686 # UI
            - containerPort: 14268 # Collector (HTTP)
            - containerPort: 14250 # Collector (gRPC)
            - containerPort: 6831  # Agent (UDP)
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: collector-http
      port: 14268
      targetPort: 14268
    - name: collector-grpc
      port: 14250
      targetPort: 14250
    - name: agent-udp
      port: 6831
      targetPort: 6831
      protocol: UDP